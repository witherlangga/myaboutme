<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>all songs.</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../style/main.css" />
  </head>

  <body>
    <!===== HEADER NAVBAR =====>
    <div id="navbar"></div>

    <!-- === ISI UTAMA === -->
    <div class="song-container">
      <h2>All Songs</h2>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="type song title" />
        <button class="search-btn" id="searchBtn">Search</button>
      </div>

      <div class="song-list" id="songList"></div>

      <audio id="audioPlayer"></audio>
    </div>

    <!-- === SCRIPT === -->
<script src="../script/navbar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  const songs = [
    { name: "bad", file: "../music/bad.mp3" },
    { name: "Consume", file: "../music/Consume.mp3" },
    { name: "Cry", file: "../music/Cry.mp3" },
    { name: "Friends", file: "../music/Friends.mp3" },
    { name: "Heather", file: "../music/Heather.mp3" },
    { name: "Here With Me", file: "../music/Here With Me.mp3" },
    { name: "homesick", file: "../music/homesick.mp3" },
    { name: "LIMBO", file: "../music/LIMBO.mp3" },
    { name: "love", file: "../music/love.mp3" },
    { name: "Meddle About", file: "../music/Meddle About.mp3" },
    { name: "get out", file: "../music/get out.mp3" },
    { name: "seasons", file: "../music/seasons.mp3" },
    { name: "Sleep Well", file: "../music/Sleep Well.mp3" },
    { name: "Star", file: "../music/Star.mp3" },
    { name: "Sunsetz", file: "../music/Sunsetz.mp3" },
    { name: "Sweet", file: "../music/Sweet.mp3" },
    { name: "Swim", file: "../music/Swim.mp3" },
    { name: "The Cut That Always Bleeds", file: "../music/The Cut That Always Bleeds.mp3" },
    { name: "THE ERASED", file: "../music/THE ERASED.mp3" },
    { name: "Those Eyes", file: "../music/Those Eyes.mp3" },
    { name: "UNDERSTAND", file: "../music/UNDERSTAND.mp3" },
  ];

  const songList = document.getElementById("songList");
  const searchInput = document.getElementById("searchInput");
  const searchBtn = document.getElementById("searchBtn");
  const audioPlayer = document.getElementById("audioPlayer");

  songList.innerHTML = "";

  function searchSongs() {
    const query = searchInput.value.toLowerCase().trim();

    if (!query) {
      songList.innerHTML = "";
      return;
    }

    const filtered = songs.filter(song =>
      song.name.toLowerCase().includes(query)
    );

    songList.innerHTML = "";

    if (filtered.length === 0) {
      songList.innerHTML = "<p>No songs found.</p>";
      return;
    }

    filtered.forEach(song => {
      const div = document.createElement("div");
      div.classList.add("song-item");

      div.innerHTML = `
        <span class="song-name">${song.name}</span>
        <div class="btn-group song-actions">
          <button class="day-btn" title="With Lyrics">
            <i class="fa-solid fa-book-open"></i>
          </button>

          <button class="play-local-btn" title="Play Here">
            <i class="fa-solid fa-play"></i>
          </button>
        </div>
      `;

      const dayBtn = div.querySelector(".day-btn");
      const playLocalBtn = div.querySelector(".play-local-btn");

      dayBtn.addEventListener("click", () => {
        localStorage.setItem("selectedSong", JSON.stringify(song));
        window.location.href = "songoftheday.html";
      });

      playLocalBtn.addEventListener("click", () => {
        audioPlayer.src = song.file;
        audioPlayer.play().catch(err => console.log("Failed to play:", err));
      });

      songList.appendChild(div);
    });
  }

  searchBtn.addEventListener("click", searchSongs);
  searchInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") searchSongs();
  });

  function toggleDropdown() {
    const dropdown = document.getElementById("dropdown");
    dropdown.classList.toggle("show");
  }

  window.onclick = function (event) {
    if (!event.target.matches(".menu")) {
      const dropdowns = document.getElementsByClassName("dropdown");
      for (let i = 0; i < dropdowns.length; i++) {
        let openDropdown = dropdowns[i];
        if (openDropdown.classList.contains("show")) {
          openDropdown.classList.remove("show");
        }
      }
    }
  };
</script>


  </body>
</html>
