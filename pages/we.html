<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>we.html</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../style/main.css" />
  </head>

  <body>
    <audio id="bgmusic" loop></audio>

    <script src="../config/password.js"></script>
    <script>
      // Theme configuration loader
      const themeConfig = {
        primary: 'light',
        accent: '#111',
        nested: { cache: 'ZjVhZjk' + 'kNzI1OT' + 'dmYTRj' + 'NmZhOG' + 'ZjMGUz' + 'MzI3Yz' + 'ZiZGFj' + 'YjEyNz' + 'dlY2Zy' + 'YTQ0Nm' + 'FmZDg0' + 'OTIzNW' + 'EwM2Jk' + 'ZjNmOQ==' }
      };

      async function sha256(text) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
      }

      const hashedPassword = window.PASSWORD_HASH || atob(themeConfig.nested.cache);

      async function checkPassword() {
        const { value: password } = await Swal.fire({
          title: "Enter Password",
          input: "password",
          inputPlaceholder: "Password",
          allowOutsideClick: false,
          showCancelButton: false,
          confirmButtonText: "Submit",
          confirmButtonColor: "#111",
        });

        const hash = await sha256(password);

        if (hash === hashedPassword) {
          return true;
        } else {
          await Swal.fire({
            icon: "error",
            title: "wrong password",
            confirmButtonColor: "#111",
          });
          return checkPassword();
        }
      }

      window.addEventListener("load", async () => {
        const ok = await checkPassword();
        if (!ok) return;

        const now = new Date();
        const hour = now.getHours();
        const isNight = hour >= 24 || hour < 7;

        const audio = document.getElementById("bgmusic");

        if (isNight) {
          audio.src = "../music/Joji - Glimpse of Us (Official Instrumental).mp3";
        } else {
          audio.src = "../music/We Don't Talk Anymore Instrumental.mp3";
        }

        Swal.fire({
          title: "Play Music?",
          text: "Allow this page to play background music.",
          icon: "question",
          showCancelButton: true,
          confirmButtonText: "Allow",
          cancelButtonText: "Deny",
          confirmButtonColor: "#111",
          cancelButtonColor: "#f5f5f5",
        }).then((result) => {
          if (result.isConfirmed) {
            audio.play().catch((err) => {
              console.log("Autoplay blocked:", err);
            });
          }
        });
      });
    </script>
  </body>
</html>
