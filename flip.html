<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin Flip</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      margin: 0;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2em;
    }

    .coin {
      width: 180px;
      height: 180px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s;
      perspective: 1000px;
    }

    .side {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    .heads {
      background: radial-gradient(circle at 30% 30%, #facc15, #b45309);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.3), 0 0 25px rgba(255, 215, 0, 0.5);
    }

    .tails {
      background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.3), 0 0 25px rgba(96, 165, 250, 0.5);
      transform: rotateY(180deg);
    }

    .btn {
      margin-top: 30px;
      padding: 12px 25px;
      font-size: 1.1em;
      border: none;
      border-radius: 10px;
      background: #10b981;
      color: white;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }

    .btn:hover {
      background: #059669;
      transform: scale(1.05);
    }

    .result {
      margin-top: 25px;
      font-size: 1.3em;
      font-weight: 600;
      height: 1.3em;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    @keyframes spin-heads {
      0% { transform: rotateY(0); }
      100% { transform: rotateY(1800deg); }
    }

    @keyframes spin-tails {
      0% { transform: rotateY(0); }
      100% { transform: rotateY(1980deg); }
    }
  </style>
</head>
<body>
  <h1>🪙 Coin Flip</h1>

  <div class="coin" id="coin">
    <div class="side heads">HEADS</div>
    <div class="side tails">TAILS</div>
  </div>

  <button class="btn" id="flipBtn">Flip Coin</button>
  <div class="result" id="result"></div>

  <script>
    const coin = document.getElementById('coin');
    const result = document.getElementById('result');
    const flipBtn = document.getElementById('flipBtn');

    flipBtn.addEventListener('click', () => {
      result.textContent = "";
      coin.style.animation = "none";
      const random = Math.random();

      if (random < 0.5) {
        setTimeout(() => {
          coin.style.animation = "spin-heads 2s forwards";
        }, 100);
        setTimeout(() => {
          result.textContent = "Result: HEADS 🎯";
        }, 2000);
      } else {
        setTimeout(() => {
          coin.style.animation = "spin-tails 2s forwards";
        }, 100);
        setTimeout(() => {
          result.textContent = "Result: TAILS 💫";
        }, 2000);
      }
    });
  </script>
</body>
</html>
